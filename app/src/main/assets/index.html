<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>演播智联</title>
    <style>
        body {
            margin: 0;
            background: #1e2b3a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            background: #3498db;
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p style="margin:0;">正在连接演播智联服务器...</p>
    <a href="https://101.200.62.170/home" class="btn" id="enterBtn">点击进入</a>

    <script>
        // 自动跳转到云端主页
        setTimeout(function() {
            window.location.href = 'https://101.200.62.170/home';
        }, 1500);

        // 如果自动跳转被阻止（如浏览器限制），3秒后显示手动按钮
        setTimeout(function() {
            document.getElementById('enterBtn').style.display = 'inline-block';
        }, 3000);
    </script>
</body>
</html>
