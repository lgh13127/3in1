<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>演播智联 · 演播联控中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3a 0%, #2c3e50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .home-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 45px 40px 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
        }

        .button-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        .nav-btn {
            flex: 1 1 260px;
            border: none;
            border-radius: 40px;
            padding: 28px 20px;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .nav-btn .icon {
            font-size: 3.8rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .nav-btn span:not(.icon) {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-btn small {
            font-size: 0.85rem;
            opacity: 0.8;
            font-weight: normal;
            margin-top: 4px;
        }

        .nav-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 28px 40px rgba(0, 0, 0, 0.45);
            border-color: #f1c40f;
            filter: brightness(1.02);
        }

        .btn-agora {
            background: linear-gradient(145deg, #3498db, #2980b9);
        }

        .btn-video {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
        }

        /* TALLY 卡片内部 */
        .tally-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
        }

        .tally-main-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: white;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
        }

        .tally-sub-buttons {
            display: flex;
            width: 100%;
            gap: 15px;
            justify-content: center;
        }

        .tally-sub-btn {
            flex: 1;
            background: linear-gradient(145deg, #f5b042, #e67e22);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            padding: 18px 8px;
            color: white;
            font-weight: 800;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 215, 0, 0.2);
            text-align: center;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .tally-sub-btn:hover {
            background: linear-gradient(145deg, #f9ca24, #f39c12);
            border-color: #f1c40f;
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(241, 196, 15, 0.4), 0 0 0 3px rgba(255, 215, 0, 0.3);
            color: white;
        }

        .btn-tally .icon {
            display: block;
        }

        .btn-tally span:not(.icon):not(.tally-main-title):not(.tally-sub-btn) {
            display: none;
        }

        .btn-tally {
            cursor: default;
        }

        .btn-tally:hover {
            transform: none;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: transparent;
        }

        .footer-note {
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1a1f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .iframe-overlay.active {
            display: flex;
            opacity: 1;
        }

        .iframe-header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
            gap: 12px;
        }

        .module-title {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 18px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home-btn {
            background: #f1c40f;
            border: none;
            padding: 10px 26px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: #1e2b3a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .back-home-btn:hover {
            background: #ffd966;
            transform: scale(1.02);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.2s ease;
        }

        .iframe-wrapper.active {
            visibility: visible;
            opacity: 1;
            z-index: 1;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #f1c40f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
            max-width: 90vw;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-toast.show {
            opacity: 1;
        }

        @media (max-width: 750px) {
            .home-card {
                padding: 30px 20px;
            }
            .nav-btn {
                padding: 22px 12px;
            }
            .nav-btn .icon {
                font-size: 3rem;
            }
            .nav-btn span:not(.icon) {
                font-size: 1.3rem;
            }
            .tally-main-title {
                font-size: 1.8rem;
            }
            .tally-sub-btn {
                font-size: 1.1rem;
                padding: 14px 4px;
            }
            .iframe-header {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="home-card" id="homeCard">
        <h1>🎙️ 演播智联</h1>
        <div class="subtitle">演播联控中心</div>

        <div class="button-grid">
            <!-- TALLY 卡片：圆形按钮图标 🔘 -->
            <div class="nav-btn btn-tally" id="tallyCard">
                <div class="tally-card-content">
                    <span class="icon">🔘</span>
                    <div class="tally-main-title">TALLY</div>
                    <div class="tally-sub-buttons">
                        <button class="tally-sub-btn" data-tally-type="tsl">TSL</button>
                        <button class="tally-sub-btn" data-tally-type="bmd">BMD</button>
                    </div>
                </div>
            </div>

            <!-- INTERCOM 通话 -->
            <div class="nav-btn btn-agora" data-key="intercom">
                <span class="icon">🎤</span>
                <span>INTERCOM<br>通话</span>
                <small>音频通话</small>
            </div>

            <!-- PGM返送：显示器图标 🖥️ -->
            <div class="nav-btn btn-video" data-key="pgm">
                <span class="icon">🖥️</span>
                <span>PGM返送</span>
                <small>音视频返送</small>
            </div>
        </div>

        <div class="footer-note">
            <span>🔄 点击【返回主页】退出模块</span>
        </div>
    </div>

    <!-- iframe 模态层 -->
    <div class="iframe-overlay" id="iframeOverlay">
        <div class="iframe-header">
            <div class="module-title" id="currentModuleTitle">
                <span>📡</span> 模块加载中...
            </div>
            <button class="back-home-btn" id="closeIframeBtn">
                ← 返回主页
            </button>
        </div>
        <div class="iframe-container" id="iframeContainer">
            <div class="iframe-loading" id="iframeLoading">
                <div class="spinner"></div>
                <span>正在连接演播服务器...</span>
            </div>
            <div id="iframeWrappers"></div>
        </div>
    </div>

    <div id="errorToast" class="error-toast"></div>

    <script>
        (function() {
            // ---------- 固定 URL 加载（所有模块统一使用）----------
            function openFixedUrlInIframe(url, title) {
                const fixedKey = 'fixed_' + Date.now();
                const module = {
                    key: fixedKey,
                    name: title,
                    wrapper: null,
                    iframe: null,
                    loaded: false
                };
                
                const wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';
                wrapper.setAttribute('data-module-key', fixedKey);
                const iframe = document.createElement('iframe');
                iframe.title = title;
                iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-downloads allow-popups-to-escape-sandbox allow-microphone allow-camera');
                iframe.setAttribute('allow', 'camera; microphone; autoplay; display-capture; fullscreen');
                wrapper.appendChild(iframe);
                iframeWrappersDiv.appendChild(wrapper);
                
                module.wrapper = wrapper;
                module.iframe = iframe;
                
                document.querySelectorAll('.iframe-wrapper').forEach(w => w.classList.remove('active'));
                wrapper.classList.add('active');
                
                currentModuleTitleSpan.innerHTML = `<span>${title}</span>`;
                
                iframeLoading.style.display = 'flex';
                if (loadTimeout) clearTimeout(loadTimeout);
                loadTimeout = setTimeout(() => {
                    if (iframeLoading.style.display === 'flex') {
                        iframeLoading.style.display = 'none';
                        showErrorMsg(`模块 ${title} 加载超时`);
                    }
                }, 10000);
                
                iframe.onload = () => {
                    clearTimeout(loadTimeout);
                    iframeLoading.style.display = 'none';
                    module.loaded = true;
                };
                iframe.onerror = () => {
                    clearTimeout(loadTimeout);
                    iframeLoading.style.display = 'none';
                    showErrorMsg(`无法加载模块 ${title}`);
                };
                iframe.src = url;
                
                currentActiveKey = fixedKey;
                homeCard.style.display = 'none';
                iframeOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            let currentActiveKey = null;
            let loadTimeout = null;
            
            const iframeOverlay = document.getElementById('iframeOverlay');
            const homeCard = document.getElementById('homeCard');
            const iframeLoading = document.getElementById('iframeLoading');
            const currentModuleTitleSpan = document.getElementById('currentModuleTitle');
            const iframeWrappersDiv = document.getElementById('iframeWrappers');
            const closeIframeBtn = document.getElementById('closeIframeBtn');
            
            function showErrorMsg(msg) {
                const toast = document.getElementById('errorToast');
                toast.textContent = msg;
                toast.classList.add('show');
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
            }

            function closeOverlay() {
                iframeOverlay.classList.remove('active');
                document.body.style.overflow = '';
                homeCard.style.display = 'block';
                iframeLoading.style.display = 'none';
            }

            // INTERCOM 通话
            document.querySelector('[data-key="intercom"]').addEventListener('click', () => {
                openFixedUrlInIframe('https://101.200.62.170:8081/mobile.html', 'INTERCOM 通话');
            });

            // PGM返送
            document.querySelector('[data-key="pgm"]').addEventListener('click', () => {
                openFixedUrlInIframe('https://101.200.62.170:8081/return.html', 'PGM 返送');
            });

            // TALLY 卡片内的小按钮
            document.querySelectorAll('.tally-sub-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const type = btn.getAttribute('data-tally-type');
                    if (type === 'tsl') {
                        openFixedUrlInIframe('https://101.200.62.170:8082/monitor.html', 'TSL TALLY 监视器');
                    } else if (type === 'bmd') {
                        openFixedUrlInIframe('https://101.200.62.170:8083/monitor.html', 'BMD TALLY 监视器');
                    }
                });
            });

            closeIframeBtn.addEventListener('click', closeOverlay);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && iframeOverlay.classList.contains('active')) closeOverlay();
            });

        })();
    </script>
</body>
</html>
