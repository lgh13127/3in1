<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>演播智联 · 融媒体控制中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3a 0%, #2c3e50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .home-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 45px 40px 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
        }

        .connection-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 60px;
            padding: 15px 20px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
            text-align: left;
        }

        .input-field label {
            display: block;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            outline: none;
        }

        .input-field input:focus {
            border-color: #f1c40f;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.3);
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .port-hint {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
            margin-left: 12px;
        }

        .button-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        .nav-btn {
            flex: 1 1 260px;
            border: none;
            border-radius: 40px;
            padding: 28px 20px;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .nav-btn .icon {
            font-size: 3.8rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .nav-btn span:not(.icon) {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-btn small {
            font-size: 0.85rem;
            opacity: 0.8;
            font-weight: normal;
            margin-top: 4px;
        }

        .nav-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 28px 40px rgba(0, 0, 0, 0.45);
            border-color: #f1c40f;
            filter: brightness(1.02);
        }

        .btn-tally {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-agora {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
        }

        .btn-video {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
        }

        .footer-note {
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1a1f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .iframe-overlay.active {
            display: flex;
            opacity: 1;
        }

        .iframe-header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
            gap: 12px;
        }

        .module-title {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 18px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home-btn {
            background: #f1c40f;
            border: none;
            padding: 10px 26px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: #1e2b3a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .back-home-btn:hover {
            background: #ffd966;
            transform: scale(1.02);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #f1c40f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 750px) {
            .home-card {
                padding: 30px 20px;
            }
            .nav-btn {
                padding: 22px 12px;
            }
            .nav-btn .icon {
                font-size: 3rem;
            }
            .nav-btn span:not(.icon) {
                font-size: 1.3rem;
            }
            .connection-group {
                flex-direction: column;
                align-items: stretch;
                border-radius: 32px;
                gap: 12px;
            }
            .iframe-header {
                padding: 10px 16px;
            }
        }

        .error-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
            max-width: 90vw;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="home-card" id="homeCard">
        <h1>🎙️ 演播智联</h1>
        <div class="subtitle">自建媒体辅助控制中心</div>

        <div class="connection-group">
            <div class="input-field">
                <label>🌐 服务器地址</label>
                <input type="text" id="serverAddress" placeholder="例如: 192.168.1.100 或 studio.example.com" autocomplete="off">
                
            </div>
            <div class="input-field">
                <label>🔌 服务端口</label>
                <input type="text" id="serverPort" placeholder="8082" value="8082" autocomplete="off">
               
            </div>
        </div>

        <div class="button-grid">
            <div class="nav-btn btn-tally" data-page="monitor.html" data-module="TALLY 监视器">
                <span class="icon">🔴</span>
                <span>TSL UMD V5<br>TALLY</span>
                <small>设备TALLY实时监控</small>
            </div>
            <div class="nav-btn btn-agora" data-page="mobile.html" data-module="INTERCOM 通话">
                <span class="icon">🎤</span>
                <span>INTERCOM<br>通话</span>
                <small>音频通话</small>
            </div>
            <div class="nav-btn btn-video" data-page="return.html" data-module="视频返送">
                <span class="icon">📹</span>
                <span>PGM返送</span>
                <small>音视频返送</small>
            </div>
        </div>

        <div class="footer-note">
            <span>🔄 点击【返回主页】退出模块</span>
        </div>
    </div>

    <div class="iframe-overlay" id="iframeOverlay">
        <div class="iframe-header">
            <div class="module-title" id="currentModuleTitle">
                <span>📡</span> 模块加载中...
            </div>
            <button class="back-home-btn" id="closeIframeBtn">
                ← 返回主页
            </button>
        </div>
        <div class="iframe-container" id="iframeContainer">
            <div class="iframe-loading" id="iframeLoading">
                <div class="spinner"></div>
                <span>正在连接演播服务器...</span>
            </div>
            <iframe id="dynamicIframe" title="演播模块" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-downloads allow-popups-to-escape-sandbox allow-microphone allow-camera" allow="camera; microphone; autoplay; display-capture; fullscreen"></iframe>
        </div>
    </div>

    <div id="errorToast" class="error-toast"></div>

    <script>
        (function() {
            const serverAddressInput = document.getElementById('serverAddress');
            const serverPortInput = document.getElementById('serverPort');
            const homeCard = document.getElementById('homeCard');
            const iframeOverlay = document.getElementById('iframeOverlay');
            const dynamicIframe = document.getElementById('dynamicIframe');
            const iframeLoading = document.getElementById('iframeLoading');
            const closeIframeBtn = document.getElementById('closeIframeBtn');
            const currentModuleTitleSpan = document.getElementById('currentModuleTitle');
            
            let toastTimeout = null;
            function showErrorMsg(msg) {
                const toast = document.getElementById('errorToast');
                toast.textContent = msg;
                toast.classList.add('show');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }

            function sanitizeAddress(raw) {
                let clean = raw.trim();
                if (!clean) return '';
                clean = clean.replace(/^https?:\/\//i, '');
                clean = clean.replace(/\/+$/, '');
                return clean;
            }

            function getValidPort(rawPort) {
                let portStr = rawPort.trim();
                if (portStr === "") return 8082;
                let portNum = parseInt(portStr, 10);
                if (isNaN(portNum) || portNum <= 0 || portNum > 65535) return 8082;
                return portNum;
            }

            // 判断主机名是否为有效地址（过滤微信等环境中的特殊字符串）
            function isValidHostname(hostname) {
                if (!hostname) return false;
                const invalidPatterns = [
                    'com.tencent', 'fileprovider', 'wechat', 'localhost', '127.0.0.1',
                    '0.0.0.0', '::1', 'null', 'undefined'
                ];
                const lowerHost = hostname.toLowerCase();
                for (let pattern of invalidPatterns) {
                    if (lowerHost.includes(pattern)) return false;
                }
                // 简单IP或域名格式：包含点或字母，且长度合理
                return /^[a-zA-Z0-9.-]+$/.test(hostname) && hostname.length > 0;
            }

            // 强制使用 HTTPS 协议
            function buildTargetUrl(page) {
                let addressRaw = serverAddressInput.value;
                let portRaw = serverPortInput.value;
                let address = sanitizeAddress(addressRaw);
                let port = getValidPort(portRaw);
                
                if (address === "") {
                    address = window.location.hostname;
                    if (!isValidHostname(address)) address = '';
                    if (!address) address = '127.0.0.1';
                }
                
                const protocol = 'https:';
                let url = `${protocol}//${address}:${port}/${page}`;
                return url;
            }

            function openModule(page, moduleDisplayName) {
                let addrRaw = serverAddressInput.value.trim();
                if (addrRaw === "") {
                    showErrorMsg("请填写服务器地址 (例如 192.168.1.100)");
                }
                let portVal = serverPortInput.value.trim();
                if (portVal === "") serverPortInput.value = "8082";
                else {
                    const portNum = parseInt(portVal, 10);
                    if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                        showErrorMsg("端口号无效，已重置为8082");
                        serverPortInput.value = "8082";
                    }
                }
                if (!serverAddressInput.value.trim()) {
                    let defaultHost = window.location.hostname;
                    if (isValidHostname(defaultHost)) {
                        serverAddressInput.value = defaultHost;
                    }
                }
                
                const targetUrl = buildTargetUrl(page);
                if (!targetUrl || targetUrl.indexOf('//') === -1) {
                    showErrorMsg("生成的URL无效，请确认服务器地址和端口");
                    return;
                }
                
                const titleText = moduleDisplayName || page;
                currentModuleTitleSpan.innerHTML = `<span>${titleText}</span>`;
                
                homeCard.style.display = 'none';
                iframeOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                iframeLoading.style.display = 'flex';
                
                if (window.loadTimeout) clearTimeout(window.loadTimeout);
                window.loadTimeout = setTimeout(() => {
                    if (iframeLoading && iframeLoading.style.display === 'flex') {
                        iframeLoading.style.display = 'none';
                        showErrorMsg("连接超时，请检查服务器地址、端口或服务状态");
                    }
                }, 10000);
                
                dynamicIframe.onload = () => {
                    clearTimeout(window.loadTimeout);
                    iframeLoading.style.display = 'none';
                };
                
                dynamicIframe.onerror = () => {
                    clearTimeout(window.loadTimeout);
                    iframeLoading.style.display = 'none';
                    showErrorMsg(`无法加载模块: ${targetUrl} ，请验证服务器是否运行且端口可访问`);
                };
                
                dynamicIframe.src = targetUrl;
            }
            
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = btn.getAttribute('data-page');
                    const moduleName = btn.getAttribute('data-module') || '';
                    if (!page) {
                        showErrorMsg("页面配置缺失");
                        return;
                    }
                    openModule(page, moduleName);
                });
            });
            
            closeIframeBtn.addEventListener('click', () => {
                if (iframeOverlay.classList.contains('active')) {
                    dynamicIframe.src = 'about:blank';
                    iframeOverlay.classList.remove('active');
                    iframeLoading.style.display = 'flex';
                    document.body.style.overflow = '';
                    if (window.loadTimeout) clearTimeout(window.loadTimeout);
                    homeCard.style.display = 'block';
                }
            });
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && iframeOverlay.classList.contains('active')) {
                    closeIframeBtn.click();
                }
            });
            
            function initDefaultConnection() {
                if (!serverPortInput.value) serverPortInput.value = "8082";
                let currentHost = window.location.hostname;
                // 只有在主机名有效时才自动填入
                if (isValidHostname(currentHost)) {
                    serverAddressInput.value = currentHost;
                } else {
                    serverAddressInput.placeholder = "例如: 192.168.1.100 或 studio.com";
                    // 确保输入框为空，不残留任何无关字符串
                    serverAddressInput.value = "";
                }
            }
            initDefaultConnection();
            
            const styleCheck = document.createElement('style');
            styleCheck.textContent = `
                .button-grid .nav-btn {
                    min-height: 220px;
                    justify-content: center;
                }
                @media (max-width: 700px) {
                    .button-grid .nav-btn {
                        min-height: 190px;
                    }
                }
                .iframe-container iframe {
                    background: #0b1217;
                }
            `;
            document.head.appendChild(styleCheck);
        })();
    </script>
</body>
</html>
