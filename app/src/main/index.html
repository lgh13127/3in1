<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>演播智联 · 演播联控中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3a 0%, #2c3e50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .home-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 45px 40px 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
        }

        .connection-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 60px;
            padding: 15px 25px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .input-field {
            flex: 1;
            min-width: 280px;
            max-width: 480px;
            text-align: left;
            margin: 0 auto;
            position: relative;
        }

        .input-field label {
            display: block;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            outline: none;
        }

        .input-field input:focus {
            border-color: #f1c40f;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.3);
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .button-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        .nav-btn {
            flex: 1 1 260px;
            border: none;
            border-radius: 40px;
            padding: 28px 20px;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .nav-btn .icon {
            font-size: 3.8rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .nav-btn span:not(.icon) {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-btn small {
            font-size: 0.85rem;
            opacity: 0.8;
            font-weight: normal;
            margin-top: 4px;
        }

        .nav-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 28px 40px rgba(0, 0, 0, 0.45);
            border-color: #f1c40f;
            filter: brightness(1.02);
        }

        .btn-tally {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-agora {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
        }

        .btn-video {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
        }

        .footer-note {
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1a1f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .iframe-overlay.active {
            display: flex;
            opacity: 1;
        }

        .iframe-header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
            gap: 12px;
        }

        .module-title {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 18px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home-btn {
            background: #f1c40f;
            border: none;
            padding: 10px 26px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: #1e2b3a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .back-home-btn:hover {
            background: #ffd966;
            transform: scale(1.02);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        /* 多iframe容器：每个模块的iframe独立显示/隐藏 */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.2s ease;
        }
        .iframe-wrapper.active {
            visibility: visible;
            opacity: 1;
            z-index: 1;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #f1c40f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 750px) {
            .home-card {
                padding: 30px 20px;
            }
            .nav-btn {
                padding: 22px 12px;
            }
            .nav-btn .icon {
                font-size: 3rem;
            }
            .nav-btn span:not(.icon) {
                font-size: 1.3rem;
            }
            .connection-group {
                flex-direction: column;
                align-items: stretch;
                border-radius: 32px;
                gap: 12px;
                padding: 15px 20px;
            }
            .input-field {
                min-width: auto;
                width: 100%;
            }
            .iframe-header {
                padding: 10px 16px;
            }
        }

        .error-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
            max-width: 90vw;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="home-card" id="homeCard">
        <h1>🎙️ 演播智联</h1>
        <div class="subtitle">演播联控中心</div>

        <div class="connection-group">
            <div class="input-field">
                <label>🌐 服务器地址</label>
                <!-- 移除 datalist，只保留输入框，由最近成功地址自动填充 -->
                <input type="text" id="serverAddress" placeholder="例如: 192.168.1.100 或 studio.example.com" autocomplete="off">
            </div>
        </div>

        <div class="button-grid">
            <div class="nav-btn btn-tally" data-page="monitor.html" data-module="TALLY 监视器" data-key="tally">
                <span class="icon">🔴</span>
                <span>TSL UMD V5<br>TALLY</span>
                <small>设备TALLY实时监控</small>
            </div>
            <div class="nav-btn btn-agora" data-page="mobile.html" data-module="INTERCOM 通话" data-key="intercom">
                <span class="icon">🎤</span>
                <span>INTERCOM<br>通话</span>
                <small>音频通话</small>
            </div>
            <div class="nav-btn btn-video" data-page="return.html" data-module="视频返送" data-key="pgm">
                <span class="icon">📹</span>
                <span>PGM返送</span>
                <small>音视频返送</small>
            </div>
        </div>

        <div class="footer-note">
            <span>🔄 点击【返回主页】退出模块</span>
        </div>
    </div>

    <div class="iframe-overlay" id="iframeOverlay">
        <div class="iframe-header">
            <div class="module-title" id="currentModuleTitle">
                <span>📡</span> 模块加载中...
            </div>
            <button class="back-home-btn" id="closeIframeBtn">
                ← 返回主页
            </button>
        </div>
        <div class="iframe-container" id="iframeContainer">
            <div class="iframe-loading" id="iframeLoading">
                <div class="spinner"></div>
                <span>正在连接演播服务器...</span>
            </div>
            <!-- 动态创建的 iframe 包装器会放在这里 -->
            <div id="iframeWrappers"></div>
        </div>
    </div>

    <div id="errorToast" class="error-toast"></div>

    <script>
        (function() {
            const serverAddressInput = document.getElementById('serverAddress');
            const homeCard = document.getElementById('homeCard');
            const iframeOverlay = document.getElementById('iframeOverlay');
            const iframeLoading = document.getElementById('iframeLoading');
            const closeIframeBtn = document.getElementById('closeIframeBtn');
            const currentModuleTitleSpan = document.getElementById('currentModuleTitle');
            const iframeWrappersDiv = document.getElementById('iframeWrappers');
            
            // ---------- 地址记忆功能：只保留最近一次成功连接的地址 ----------
            const STORAGE_KEY_LAST_SUCCESS = 'last_success_address';
            
            // 获取最近一次成功连接的地址
            function getLastSuccessAddress() {
                try {
                    return localStorage.getItem(STORAGE_KEY_LAST_SUCCESS) || '';
                } catch(e) {
                    console.warn(e);
                    return '';
                }
            }
            
            // 保存最近一次成功连接的地址
            function saveLastSuccessAddress(address) {
                if (!address || typeof address !== 'string') return;
                const trimmed = address.trim();
                if (trimmed === '') return;
                try {
                    localStorage.setItem(STORAGE_KEY_LAST_SUCCESS, trimmed);
                } catch(e) { console.warn(e); }
            }
            
            // 初始化输入框：优先显示最近成功地址，否则显示当前hostname（如果有）
            function initServerAddressInput() {
                const lastAddr = getLastSuccessAddress();
                if (lastAddr) {
                    serverAddressInput.value = lastAddr;
                    serverAddressInput.placeholder = "服务器地址";
                } else {
                    // 尝试使用当前页面的主机名作为默认提示，但不自动填充（避免无效地址）
                    let currentHost = window.location.hostname;
                    if (currentHost && !['localhost', '127.0.0.1', '0.0.0.0', '::1'].includes(currentHost)) {
                        serverAddressInput.placeholder = `例如: ${currentHost} 或 192.168.1.100`;
                    } else {
                        serverAddressInput.placeholder = "例如: 192.168.1.100 或 studio.example.com";
                    }
                    // 不清空已有值
                }
            }
            
            // ---------- 其余原有逻辑（适配单地址记忆）----------
            function showErrorMsg(msg) {
                const toast = document.getElementById('errorToast');
                toast.textContent = msg;
                toast.classList.add('show');
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }

            // 清理地址：去掉协议和末尾斜杠
            function sanitizeAddress(raw) {
                let clean = raw.trim();
                if (!clean) return '';
                clean = clean.replace(/^https?:\/\//i, '');
                clean = clean.replace(/\/+$/, '');
                return clean;
            }

            // 判断主机名是否有效
            function isValidHostname(hostname) {
                if (!hostname) return false;
                const invalidPatterns = [
                    'com.tencent', 'fileprovider', 'wechat', 'localhost', '127.0.0.1',
                    '0.0.0.0', '::1', 'null', 'undefined'
                ];
                const lowerHost = hostname.toLowerCase();
                for (let pattern of invalidPatterns) {
                    if (lowerHost.includes(pattern)) return false;
                }
                return /^[a-zA-Z0-9.-]+$/.test(hostname) && hostname.length > 0;
            }

            // 构建目标URL（固定端口8082，https）
            function buildTargetUrl(page) {
                let addressRaw = serverAddressInput.value;
                let address = sanitizeAddress(addressRaw);
                if (address === "") {
                    let currentHost = window.location.hostname;
                    if (isValidHostname(currentHost)) {
                        address = currentHost;
                    } else {
                        address = '127.0.0.1';
                    }
                }
                const protocol = 'https:';
                const port = 8082;
                return `${protocol}//${address}:${port}/${page}`;
            }

            // 存储每个模块的包装器元素和加载状态
            const modules = {
                tally: { key: 'tally', page: 'monitor.html', name: 'TALLY 监视器', wrapper: null, iframe: null, loaded: false, url: null },
                intercom: { key: 'intercom', page: 'mobile.html', name: 'INTERCOM 通话', wrapper: null, iframe: null, loaded: false, url: null },
                pgm: { key: 'pgm', page: 'return.html', name: '视频返送', wrapper: null, iframe: null, loaded: false, url: null }
            };
            
            let currentActiveKey = null;   // 当前显示的模块key
            let loadTimeout = null;
            
            // 创建模块的iframe包装器（如果尚未创建）
            function ensureModuleWrapper(module) {
                if (module.wrapper) return module.wrapper;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';
                wrapper.setAttribute('data-module-key', module.key);
                const iframe = document.createElement('iframe');
                iframe.title = module.name;
                iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-downloads allow-popups-to-escape-sandbox allow-microphone allow-camera');
                iframe.setAttribute('allow', 'camera; microphone; autoplay; display-capture; fullscreen');
                wrapper.appendChild(iframe);
                iframeWrappersDiv.appendChild(wrapper);
                
                module.wrapper = wrapper;
                module.iframe = iframe;
                return wrapper;
            }
            
            // 加载指定模块（创建iframe并设置src，如果尚未加载过）
            function loadModule(moduleKey, forceReload = false) {
                const module = modules[moduleKey];
                if (!module) {
                    showErrorMsg(`未知模块: ${moduleKey}`);
                    return false;
                }
                
                // 确保包装器存在
                ensureModuleWrapper(module);
                
                // 如果需要强制重载，则清空loaded标志并重新设置src
                if (forceReload) {
                    module.loaded = false;
                    if (module.iframe) {
                        module.iframe.src = 'about:blank';
                    }
                }
                
                // 如果尚未加载，则构建URL并加载
                if (!module.loaded) {
                    const targetUrl = buildTargetUrl(module.page);
                    module.url = targetUrl;
                    // 显示全局loading（因为第一次加载需要时间）
                    iframeLoading.style.display = 'flex';
                    if (loadTimeout) clearTimeout(loadTimeout);
                    loadTimeout = setTimeout(() => {
                        if (iframeLoading && iframeLoading.style.display === 'flex') {
                            iframeLoading.style.display = 'none';
                            showErrorMsg(`模块 ${module.name} 加载超时，请检查网络或服务器地址`);
                        }
                    }, 10000);
                    
                    module.iframe.onload = () => {
                        if (loadTimeout) clearTimeout(loadTimeout);
                        iframeLoading.style.display = 'none';
                        module.loaded = true;
                        
                        // ---------- 关键修改：模块加载成功，将当前使用的地址保存为最近成功地址 ----------
                        const currentAddr = serverAddressInput.value;
                        if (currentAddr && currentAddr.trim() !== '') {
                            saveLastSuccessAddress(currentAddr.trim());
                        } else {
                            // 如果输入框为空，但使用了默认地址（例如当前hostname），也保存这个有效的默认地址
                            const usedAddr = sanitizeAddress(serverAddressInput.value);
                            if (usedAddr) {
                                saveLastSuccessAddress(usedAddr);
                            } else {
                                let fallbackAddr = window.location.hostname;
                                if (isValidHostname(fallbackAddr)) {
                                    saveLastSuccessAddress(fallbackAddr);
                                }
                            }
                        }
                        
                        // 加载完成后，如果当前激活的模块就是它，确保显示
                        if (currentActiveKey === moduleKey) {
                            // 已经显示，无需额外操作
                        }
                    };
                    module.iframe.onerror = () => {
                        if (loadTimeout) clearTimeout(loadTimeout);
                        iframeLoading.style.display = 'none';
                        showErrorMsg(`无法加载模块 ${module.name}: ${targetUrl}\n请检查服务器地址是否正确，确保目标服务已开启`);
                        module.loaded = false;
                        // 加载失败不保存地址（不覆盖之前的成功地址）
                    };
                    module.iframe.src = targetUrl;
                }
                return true;
            }
            
            // 切换到指定模块（显示对应的wrapper，隐藏其他）
            function switchToModule(moduleKey) {
                if (currentActiveKey === moduleKey) {
                    // 已经是当前模块，无需切换，但确保overlay可见
                    if (!iframeOverlay.classList.contains('active')) {
                        homeCard.style.display = 'none';
                        iframeOverlay.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                    return;
                }
                
                // 先尝试加载模块（如果未加载过）
                loadModule(moduleKey);
                
                // 更新标题
                const module = modules[moduleKey];
                if (module) {
                    currentModuleTitleSpan.innerHTML = `<span>${module.name}</span>`;
                }
                
                // 隐藏所有wrapper，显示当前选中的
                for (const key in modules) {
                    const m = modules[key];
                    if (m.wrapper) {
                        m.wrapper.classList.remove('active');
                    }
                }
                const activeWrapper = modules[moduleKey].wrapper;
                if (activeWrapper) {
                    activeWrapper.classList.add('active');
                }
                
                currentActiveKey = moduleKey;
                
                // 确保overlay显示
                homeCard.style.display = 'none';
                iframeOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                
                // 如果模块已经加载完成，确保loading隐藏
                if (modules[moduleKey].loaded) {
                    iframeLoading.style.display = 'none';
                } else {
                    // 如果还没加载完成，loading可能已经在loadModule中显示，保持显示
                }
            }
            
            // 返回主页：隐藏overlay，不清空任何iframe，保留所有状态
            function closeOverlay() {
                if (iframeOverlay.classList.contains('active')) {
                    iframeOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                    homeCard.style.display = 'block';
                    iframeLoading.style.display = 'none';
                    // 不清空iframe，保留所有模块状态
                }
            }
            
            // 模块按钮点击事件处理（不再预先保存地址，地址只在成功加载后保存）
            function onModuleClick(moduleKey) {
                // 检查地址是否为空，如果为空提示，但不阻止（可能使用默认地址）
                const currentAddr = serverAddressInput.value;
                if (!currentAddr || currentAddr.trim() === '') {
                    showErrorMsg("服务器地址为空，将尝试使用默认地址");
                }
                switchToModule(moduleKey);
            }
            
            // 绑定按钮事件
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const moduleKey = btn.getAttribute('data-key');
                    if (!moduleKey) {
                        showErrorMsg("按钮配置缺失 data-key");
                        return;
                    }
                    onModuleClick(moduleKey);
                });
            });
            
            // 返回主页按钮
            closeIframeBtn.addEventListener('click', closeOverlay);
            
            // ESC 键返回主页
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && iframeOverlay.classList.contains('active')) {
                    closeOverlay();
                }
            });
            
            // 初始化：加载最近成功地址到输入框
            initServerAddressInput();
            
            // 可选：监听输入框内容变化，但不需要额外保存（只有成功加载才保存）
            // 如果用户手动清空并输入新地址，下次成功连接时会覆盖保存
            
            // 微调样式
            const styleCheck = document.createElement('style');
            styleCheck.textContent = `
                .button-grid .nav-btn {
                    min-height: 220px;
                    justify-content: center;
                }
                @media (max-width: 700px) {
                    .button-grid .nav-btn {
                        min-height: 190px;
                    }
                }
                .iframe-wrapper {
                    position: absolute;
